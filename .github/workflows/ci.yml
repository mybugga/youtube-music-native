name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build YouTubeMusicNative.sln -c Release
      - name: Test
        run: dotnet test YouTubeMusicNative.sln -c Release --no-build
